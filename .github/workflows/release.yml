name: Release

# Publishes a GitHub Release for the version in darkmode/Cargo.toml (tag `v<version>`).
#
# Runs when darkmode/Cargo.toml changes on main, or manually from the Actions tab. If the tag for
# the current version already exists, nothing is published: bump `version` in Cargo.toml first.
on:
  push:
    branches: [main]
    paths: [darkmode/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags to check whether this version was released already

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(grep -m1 '^version' darkmode/Cargo.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from darkmode/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released. Bump version in darkmode/Cargo.toml to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.exists == 'false'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.exists == 'false'
        with:
          workspaces: darkmode

      - name: Build
        if: steps.version.outputs.exists == 'false'
        working-directory: darkmode
        run: cargo build --release

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: darkmode/target/release/hachimi_darkmode.dll
          generate_release_notes: true
